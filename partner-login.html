<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Partner Login | HARI Grooming Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#080706;color:#f5f1e8}
.partner-login-wrap{width:min(430px,92vw);padding:38px;border:1px solid rgba(201,162,39,.22);border-radius:24px;background:rgba(20,18,14,.82);box-shadow:0 30px 90px rgba(0,0,0,.45)}
.partner-login-brand{text-align:center;margin-bottom:30px}.partner-login-brand i{color:#c9a227;font-size:2rem}.partner-login-brand h1{font-family:'Cormorant Garamond',serif;font-size:2.5rem;margin:8px 0 0}.partner-login-brand p{font-size:.7rem;letter-spacing:2px;color:#a9a29a;text-transform:uppercase}
.partner-login-wrap label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:#aaa39a;margin:17px 0 8px}
.partner-login-wrap input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#11100e;color:#fff;outline:none}
.partner-login-wrap input:focus{border-color:#c9a227;box-shadow:0 0 0 3px rgba(201,162,39,.08)}
.partner-login-btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#e1c45a,#9c7410);font-weight:700;cursor:pointer}
.partner-login-error{min-height:18px;color:#d65a52;font-size:.75rem;text-align:center;margin-top:12px}
.partner-back{display:block;text-align:center;margin-top:22px;color:#aaa39a;font-size:.78rem}.partner-back:hover{color:#e1c45a}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body>
<main class="partner-login-wrap">
  <div class="partner-login-brand">
    <i class="fa-solid fa-scissors"></i>
    <h1>HARI</h1>
    <p>Grooming Studio · Partner</p>
  </div>
  <form id="partnerLoginForm">
    <label for="partnerUser">User ID</label>
    <input id="partnerUser" autocomplete="username" required>
    <label for="partnerPass">Password</label>
    <input id="partnerPass" type="password" autocomplete="current-password" required>
    <button class="partner-login-btn" type="submit">Secure Login</button>
    <div class="partner-login-error" id="partnerLoginError"></div>
  </form>
  <a class="partner-back" href="index.html">← Back to customer website</a>
</main>
<script>
document.getElementById('partnerLoginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const u=document.getElementById('partnerUser').value.trim();
  const p=document.getElementById('partnerPass').value;
  if(u==='partner' && p==='HGS@2026'){
    sessionStorage.setItem('hgsPartnerAuth','1');
    window.location.href='partner-dashboard.html';
  } else {
    document.getElementById('partnerLoginError').textContent='Invalid User ID or Password.';
  }
});
</script>
</body>
</html>
