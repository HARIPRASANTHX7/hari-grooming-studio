<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Partner Login | HARI GROOMING STUDIO</title>
<meta name="description" content="HARI GROOMING STUDIO partner portal login.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100svh;display:grid;place-items:center;background:#080807;overflow:hidden}
.login-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 35%,rgba(201,162,39,.13),transparent 34%),radial-gradient(circle at 15% 90%,rgba(201,162,39,.05),transparent 30%)}
.login-orbit{position:absolute;width:520px;height:520px;border:1px solid rgba(201,162,39,.12);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:orbit 18s linear infinite}
.login-orbit:before{content:'';position:absolute;width:7px;height:7px;background:#e9cd6f;border-radius:50%;top:10%;left:16%;box-shadow:0 0 18px #c9a227}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
.login-wrap{position:relative;width:min(440px,calc(100% - 32px));z-index:2}
.login-card{background:rgba(22,21,19,.88);border:1px solid rgba(201,162,39,.25);border-radius:28px;padding:42px;box-shadow:0 30px 90px rgba(0,0,0,.65);backdrop-filter:blur(20px);animation:loginIn .75s cubic-bezier(.22,1,.36,1)}
@keyframes loginIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.login-brand{text-align:center;margin-bottom:32px}.login-mark{width:62px;height:62px;border:1px solid #c9a227;border-radius:50%;display:grid;place-items:center;color:#e9cd6f;font-size:1.4rem;margin:0 auto 16px;animation:markFloat 3s ease-in-out infinite}
@keyframes markFloat{50%{transform:translateY(-5px) rotate(-8deg);box-shadow:0 12px 30px rgba(201,162,39,.18)}}
.login-brand h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:1.35rem}.login-brand p{color:#c9a227;text-transform:uppercase;letter-spacing:3px;font-size:.65rem;margin-top:5px}
.login-security{display:flex;align-items:center;justify-content:center;gap:7px;color:#8f8b82;font-size:.72rem;margin-top:12px}
.login-form{display:grid;gap:17px}.login-field label{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:.72rem;color:#a8a49b;margin-bottom:7px}
.login-field input{width:100%;background:#1c1a17;border:1px solid rgba(201,162,39,.18);color:#f4f2ec;border-radius:12px;padding:14px 15px;outline:none;transition:.3s}.login-field input:focus{border-color:#c9a227;box-shadow:0 0 0 4px rgba(201,162,39,.07)}
.password-wrap{position:relative}.password-wrap input{padding-right:46px}.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#8f8b82}
.login-btn{width:100%;margin-top:5px}.login-error{min-height:18px;text-align:center;color:#d3564f;font-size:.78rem}.login-note{margin-top:20px;text-align:center;color:#706c63;font-size:.7rem;line-height:1.5}
.back-site{display:block;text-align:center;margin-top:18px;color:#a8a49b;font-size:.78rem;transition:.3s}.back-site:hover{color:#e9cd6f}
@media(max-width:520px){.login-card{padding:30px 22px}.login-orbit{width:390px;height:390px}}
</style>
</head>
<body>
<div class="login-bg"><div class="login-orbit"></div></div>
<main class="login-wrap">
<section class="login-card">
<div class="login-brand">
<div class="login-mark"><i class="fa-solid fa-scissors"></i></div>
<h1>HARI GROOMING STUDIO</h1><p>Studio Partner Portal</p>
<div class="login-security"><i class="fa-solid fa-shield-halved"></i> Authorized studio access</div>
</div>
<form class="login-form" id="partnerLoginForm">
<div class="login-field"><label for="partnerEmail">Email / Username</label><input id="partnerEmail" type="text" autocomplete="username" placeholder="Enter your partner ID" required></div>
<div class="login-field"><label for="partnerPassword">Password</label><div class="password-wrap"><input id="partnerPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
<div class="login-error" id="loginError"></div>
<button class="btn btn-gold login-btn" type="submit"><i class="fa-solid fa-lock"></i> Login to Partner Portal</button>
</form>
<p class="login-note">Demo frontend authentication only. For production, use server-side authentication, hashed passwords and protected APIs.</p>
<a href="index.html" class="back-site"><i class="fa-solid fa-arrow-left"></i> Back to Customer Site</a>
</section>
</main>
<script>
const form=document.getElementById('partnerLoginForm'),email=document.getElementById('partnerEmail'),password=document.getElementById('partnerPassword'),error=document.getElementById('loginError');
document.getElementById('togglePassword').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password'});
form.addEventListener('submit',e=>{e.preventDefault();error.textContent='';const user=email.value.trim(),pass=password.value;
if((user==='partner'||user==='admin@harigroomingstudio.com')&&pass==='HGS@2026'){sessionStorage.setItem('hgs_partner_authenticated','true');window.location.href='index.html#partner'}
else{error.textContent='Invalid partner ID or password.';password.value='';document.querySelector('.login-card').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:260})}});
</script>
</body>
</html>
