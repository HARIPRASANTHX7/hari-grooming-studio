<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partner Dashboard | HARI Grooming Studio</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body class="customer-site">
<div style="min-height:100vh;padding:40px">
  <header style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
    <div><strong>HARI GROOMING STUDIO</strong><div style="color:#aaa;font-size:.75rem">STUDIO PARTNER</div></div>
    <button class="btn btn-outline" id="logout">Logout</button>
  </header>
  <main style="max-width:1200px;margin:50px auto">
    <h1 class="section-title">Studio Overview</h1>
    <div class="partner-cards">
      <div class="partner-card"><i class="fa-solid fa-calendar-check"></i><span class="pc-num">0</span><span class="pc-label">Today's Bookings</span></div>
      <div class="partner-card"><i class="fa-solid fa-clock"></i><span class="pc-num">0</span><span class="pc-label">Upcoming</span></div>
      <div class="partner-card"><i class="fa-solid fa-check"></i><span class="pc-num">0</span><span class="pc-label">Completed</span></div>
      <div class="partner-card"><i class="fa-solid fa-indian-rupee-sign"></i><span class="pc-num">₹0</span><span class="pc-label">Today's Revenue</span></div>
    </div>
    <div style="margin-top:35px;padding:25px;border:1px solid var(--border);border-radius:18px;background:var(--surface)">
      <h2>Bookings</h2><p style="color:#aaa">Partner management is separated from the customer website.</p>
    </div>
  </main>
</div>
<script>
if(sessionStorage.getItem('hgsPartnerAuth')!=='1') location.href='partner-login.html';
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('hgsPartnerAuth');location.href='partner-login.html'};
</script>
</body></html>
